<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Trivia Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .content { padding: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover { transform: translateY(-2px); }
        .question {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .question-text { font-size: 1.2em; font-weight: bold; margin-bottom: 15px; }
        .option {
            display: block;
            width: 100%;
            text-align: left;
            margin: 10px 0;
            padding: 12px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
        }
        .option:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .score { font-size: 1.5em; font-weight: bold; text-align: center; margin: 20px 0; color: #764ba2; }
        .leaderboard { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-top: 20px; }
        .leaderboard h3 { margin-bottom: 15px; color: #667eea; }
        .hidden { display: none; }
        .game-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logout-btn { background: #dc3545; padding: 8px 20px; }
        .status {
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .status-online { background: #d4edda; color: #155724; }
        .status-offline { background: #f8d7da; color: #721c24; }
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 DevOps Trivia Game</h1>
            <p>Test your DevOps knowledge!</p>
        </div>
        <div class="content">
            <div id="api-status" class="status status-offline">Connecting to server...</div>
            <div id="alert" class="alert"></div>
            
            <div id="login-section">
                <h2>Login / Register</h2>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter password">
                </div>
                <button onclick="register()">Register</button>
                <button onclick="login()">Login</button>
            </div>
            
            <div id="game-section" class="hidden">
                <div class="game-info">
                    <div class="score">Score: <span id="score">0</span></div>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
                <div id="question-area"></div>
            </div>
            
            <div id="leaderboard-section">
                <div class="leaderboard">
                    <h3>🏆 Leaderboard</h3>
                    <ul id="leaderboard-list"><li>Loading...</li></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        let token = null;
        let questions = [];
        let currentIndex = 0;
        let score = 0;
        
        async function checkAPI() {
            try {
                const response = await fetch(`${API_URL}/health`);
                if (response.ok) {
                    document.getElementById('api-status').innerHTML = '✅ Server Online';
                    document.getElementById('api-status').className = 'status status-online';
                    loadLeaderboard();
                }
            } catch(error) {
                document.getElementById('api-status').innerHTML = '❌ Server Offline';
            }
        }
        
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
            setTimeout(() => alert.style.display = 'none', 3000);
        }
        
        async function register() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try {
                const response = await fetch(`${API_URL}/api/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await response.json();
                showAlert(data.message || data.error, data.message ? 'success' : 'error');
            } catch(error) {
                showAlert('Error connecting to server', 'error');
            }
        }
        
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try {
                const response = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await response.json();
                if (data.token) {
                    token = data.token;
                    score = data.score;
                    document.getElementById('score').textContent = score;
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('game-section').classList.remove('hidden');
                    await loadQuestions();
                    await loadLeaderboard();
                } else {
                    showAlert('Invalid credentials', 'error');
                }
            } catch(error) {
                showAlert('Error connecting to server', 'error');
            }
        }
        
        async function loadQuestions() {
            try {
                const response = await fetch(`${API_URL}/api/questions`, {
                    headers: {'Authorization': token}
                });
                questions = await response.json();
                currentIndex = 0;
                showQuestion();
            } catch(error) {
                showAlert('Error loading questions', 'error');
            }
        }
        
        function showQuestion() {
            if (currentIndex >= questions.length) {
                document.getElementById('question-area').innerHTML = `
                    <div class="question">
                        <h3>🎉 Game Complete! 🎉</h3>
                        <p>Your final score: ${score}</p>
                        <button onclick="loadQuestions()">Play Again</button>
                    </div>
                `;
                return;
            }
            const q = questions[currentIndex];
            let html = `<div class="question">`;
            html += `<div class="question-text">Question ${currentIndex + 1}/${questions.length}: ${q.question_text}</div>`;
            q.options.forEach((opt, idx) => {
                html += `<div class="option" onclick="submitAnswer(${idx})">${opt}</div>`;
            });
            html += `</div>`;
            document.getElementById('question-area').innerHTML = html;
        }
        
        async function submitAnswer(answer) {
            const q = questions[currentIndex];
            try {
                const response = await fetch(`${API_URL}/api/submit-answer`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': token
                    },
                    body: JSON.stringify({question_id: q.id, answer: answer})
                });
                const result = await response.json();
                if (result.correct) {
                    score = result.new_score;
                    document.getElementById('score').textContent = score;
                    showAlert('✅ Correct! +10 points', 'success');
                } else {
                    showAlert('❌ Wrong answer!', 'error');
                }
                currentIndex++;
                showQuestion();
                await loadLeaderboard();
            } catch(error) {
                showAlert('Error submitting answer', 'error');
            }
        }
        
        async function loadLeaderboard() {
            try {
                const response = await fetch(`${API_URL}/api/leaderboard`);
                const leaders = await response.json();
                const list = document.getElementById('leaderboard-list');
                list.innerHTML = '';
                if (leaders.length === 0) {
                    list.innerHTML = '<li>No players yet. Be the first!</li>';
                } else {
                    leaders.forEach((leader, index) => {
                        const li = document.createElement('li');
                        li.innerHTML = `<span>${index + 1}. ${leader.username}</span><span><strong>${leader.score}</strong> pts</span>`;
                        li.style.padding = '10px';
                        li.style.borderBottom = '1px solid #e0e0e0';
                        if (index === 0) li.style.background = '#ffd700';
                        if (index === 1) li.style.background = '#c0c0c0';
                        if (index === 2) li.style.background = '#cd7f32';
                        list.appendChild(li);
                    });
                }
            } catch(error) {
                console.error('Error loading leaderboard');
            }
        }
        
        function logout() {
            token = null;
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('game-section').classList.add('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            showAlert('Logged out successfully', 'success');
        }
        
        checkAPI();
        setInterval(loadLeaderboard, 30000);
    </script>
</body>
</html>
